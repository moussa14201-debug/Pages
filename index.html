<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Premium Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;

    /* خلفية سوداء فخمة */
    background:
    radial-gradient(circle at top left,#2a2a2a 0%,transparent 25%),
    radial-gradient(circle at bottom right,#111 0%,transparent 30%),
    linear-gradient(135deg,#000000,#0d0d0d,#141414);

    position:relative;
}

/* تأثير ضوء متحرك */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.04);
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(80px);
    animation:move 8s infinite alternate ease-in-out;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,215,0,0.06);
    border-radius:50%;
    bottom:-120px;
    right:-120px;
    filter:blur(70px);
    animation:move2 10s infinite alternate ease-in-out;
}

@keyframes move{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(80px,40px);
    }
}

@keyframes move2{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-70px,-50px);
    }
}

/* البطاقة الرئيسية */
.container{
    position:relative;
    width:90%;
    max-width:390px;

    padding:45px 25px;

    border-radius:35px;

    background:rgba(20,20,20,0.65);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
    0 0 30px rgba(0,0,0,0.7),
    inset 0 0 20px rgba(255,255,255,0.03);

    text-align:center;

    z-index:1;
}

/* الصورة */
.profile-img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #d4af37;

    margin-bottom:18px;

    box-shadow:0 0 25px rgba(212,175,55,0.4);
}

/* الاسم */
h1{
    font-size:28px;
    font-weight:700;
    color:#ffffff;
    margin-bottom:8px;
}

/* الوصف */
.bio{
    color:#bdbdbd;
    font-size:14px;
    margin-bottom:35px;
}

/* الأزرار */
.link{
    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:white;

    margin-bottom:18px;
    padding:17px;

    border-radius:16px;

    background:linear-gradient(145deg,#111,#1c1c1c);

    border:1px solid rgba(255,255,255,0.06);

    transition:0.35s ease;

    font-weight:600;
    letter-spacing:0.5px;

    position:relative;
    overflow:hidden;
}

/* تأثير داخلي */
.link::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
    );

    left:-100%;
    top:0;
    transition:0.5s;
}

.link:hover::before{
    left:100%;
}

.link:hover{
    transform:translateY(-5px) scale(1.02);

    background:linear-gradient(145deg,#d4af37,#f5d76e);

    color:black;

    box-shadow:
    0 10px 25px rgba(212,175,55,0.35);
}

/* الفوتر */
.footer{
    margin-top:30px;
    color:#777;
    font-size:11px;
    letter-spacing:3px;
}

/* موبايل */
@media(max-width:500px){

    .container{
        padding:40px 20px;
    }

    h1{
        font-size:24px;
    }

}

</style>
</head>
<body>

<div class="container">

    <!-- ضع صورتك هنا -->
    <img src="profile.jpg" class="profile-img">

    <h1>SAIF EDDINE</h1>

    <p class="bio">
        مرحباً بك في عالمي الخاص ✨
    </p>

    <a class="link" href="https://facebook.com" target="_blank">
        Facebook
    </a>

    <a class="link" href="https://instagram.com" target="_blank">
        Instagram
    </a>

    <a class="link" href="https://tiktok.com" target="_blank">
        TikTok
    </a>

    <div class="footer">
        PREMIUM EXPERIENCE
    </div>

</div>

</body>
</html>
